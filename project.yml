name: Bai
options:
  deploymentTarget:
    iOS: "15.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.0
targets:
  Bai:
    type: application
    platform: iOS
    sources:
      - path: Bai
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iSVG4.Bai
        INFOPLIST_FILE: Bai/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bai/Bai.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "5.0"

        DEBUG_INFORMATION_FORMAT: dwarf

        STRIP_INSTALLED_PRODUCT: "YES"
        STRIP_STYLE: all
        COPY_PHASE_STRIP: "YES"
        DEPLOYMENT_POSTPROCESSING: "YES"

        OTHER_SWIFT_FLAGS: "-file-prefix-map $(SRCROOT)/=/build/ -Xfrontend -no-serialize-debugging-options"
